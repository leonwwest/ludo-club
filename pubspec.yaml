name: ludo_club
description: A lean, modern Flutter Ludo game rebuilt around pure rules and a custom-painted board.
version: 2.0.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/branding/
    - assets/backgrounds/
    - assets/dice/
    - assets/pins/
