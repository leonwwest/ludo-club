name: ludo_club
description: Ein modernes Ludo Club Spiel
version: 1.0.0+1
environment:
  sdk: ">=2.17.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.3
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.0
  intl: ^0.18.1
  just_audio: ^0.9.35
  flutter_svg: ^2.0.10
  google_fonts: ^4.0.4
  # Database dependencies
  sqflite: ^2.3.0
  path: ^1.8.3
  # Additional utilities
  uuid: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/
    - assets/board/
    - assets/dice/
    - assets/pins/
    - assets/images/
