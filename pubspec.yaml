name: ludo_club
description: A lean, modern Flutter Ludo game rebuilt around pure rules and a custom-painted board.
version: 2.0.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"

flutter_intl:
  enabled: true
  main_locale: de

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/avatars/
    - assets/branding/
    - assets/backgrounds/
    - assets/dice/
    - assets/pins/
    - assets/textures/
    - assets/audio/
