<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A local Flutter Ludo board game with custom rules and quick resume.">
  <meta name="theme-color" content="#101813">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ludo Club">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ludo Club</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #101813;
    }

    .launch-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(199, 152, 58, 0.18), transparent 30%),
        #101813;
    }

    .launch-splash img {
      width: 108px;
      height: 108px;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
    }
  </style>
</head>
<body>
  <div class="launch-splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.querySelector('.launch-splash')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
